name: Increment, Build, and Tag

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual
    inputs:
      reason:
        description: 'Reason for manual release'
        required: false
        default: 'Manual trigger'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Increment Version in build.gradle
        id: bump_version
        run: |
          # 1. Extract the current version string from the getProps() block
          OLD_VERSION=$(sed -n "s/.*'version_name'] = '\([^']*\)'.*/\1/p" build.gradle)
          echo "Old Version: $OLD_VERSION"

          # 2. Split version (e.g., 2.5.0) into parts and increment the last digit
          # This handles Semantic Versioning (Major.Minor.Patch)
          BASE_VERSION=$(echo $OLD_VERSION | cut -d. -f1-2)
          PATCH=$(echo $OLD_VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$BASE_VERSION.$NEW_PATCH"
          
          echo "New Version: $NEW_VERSION"

          # 3. Use sed to overwrite the version_name line in build.gradle
          sed -i "s/properties\['version_name'\] = '$OLD_VERSION'/properties['version_name'] = '$NEW_VERSION'/" build.gradle
          
          # 4. Save to environment for later steps
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run generateRelease task
        # Now running with the newly incremented version in build.gradle
        run: ./gradlew generateRelease

      - name: Verify Zip Exists
        run: |
          if [ ! -f "fab/build/release-${{ env.VERSION }}.zip" ]; then
            echo "Error: Zip file not found at fab/build/release-${{ env.VERSION }}.zip"
            exit 1
          fi

      - name: Commit Version Bump
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git commit -m "chore: bump version to ${{ env.VERSION }} [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: fab/build/release-${{ env.VERSION }}.zip
          body: |
            Automated Release for version ${{ env.VERSION }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
