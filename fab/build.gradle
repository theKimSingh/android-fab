buildscript {
	repositories {
		mavenCentral()
		maven {
			url "https://maven.google.com"
		}
		google()
	}

	dependencies {
		classpath 'com.android.tools.build:gradle:9.1.0'
	}
}

plugins {
	id 'maven-publish'
	id 'com.android.library'
	id 'kotlin-android'
	id 'kotlin-parcelize' // Replaces the Parcelize feature from android-extensions
}

def properties = getProps()


android {
	compileSdk 34
	namespace 'uk.co.markormesher.android_fab.fab'

	buildFeatures {
		viewBinding true
	}

	defaultConfig {
		minSdkVersion 14

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}

	sourceSets {
		main.java.srcDirs += "src/main/kotlin"
	}
	lint {
		targetSdk 34
	}
	testOptions {
		targetSdk 34
	}
	kotlin {
		jvmToolchain(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation 'androidx.annotation:annotation:1.2.0'
	implementation 'androidx.cardview:cardview:1.0.0'
	implementation 'com.google.android.material:material:1.2.1'
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

/*========================*
 * Maven Plugin Packaging *
 *========================*/


def localReleaseDest = "${buildDir}/release/${properties['version_name']}"

task androidJavadocs(type: Javadoc) {
	failOnError = false
	source = android.sourceSets.main.java.srcDirs
	ext.androidJar = "${android.sdkDirectory}/platforms/${android.compileSdkVersion}/android.jar"
	classpath += files(ext.androidJar)
}

tasks.register('androidJavadocsJar', Jar) {
	dependsOn androidJavadocs
	archiveClassifier = 'javadoc'
	from androidJavadocs.destinationDir
}

tasks.register('androidSourcesJar', Jar) {
	archiveClassifier = 'sources'
	from android.sourceSets.main.java.srcDirs
}

afterEvaluate {
	publishing {
		publications {
			release(MavenPublication) {
				// This replaces the old pom configuration
				groupId = 'uk.co.markormesher'
				artifactId = 'android-fab'
				version = properties['version_name']

				// This automatically includes your AAR and its dependencies
				from components.release
				artifact androidSourcesJar
				artifact androidJavadocsJar
			}
		}
		repositories {
			maven {
				// This replaces the old repository(url: ...)
				url = uri("file://${localReleaseDest}")
			}
		}
	}
}

task zipRelease(type: Zip) {
	from localReleaseDest
	destinationDirectory = layout.buildDirectory
	archiveFileName = "release-${project.findProperty('version_name') ?: 'unspecified'}.zip"
}

task generateRelease(dependsOn: ['publishReleasePublicationToMavenRepository', zipRelease]) {
	doLast {
		println "Release ${properties['version_name']} can be found at ${localReleaseDest}/"
		println "Release ${properties['version_name']} zipped can be found ${buildDir}/release-${properties['version_name']}.zip"
	}
}
